name: Fortu
description: >-
  Fortu (Fortu Wealth Ltd) is a London-based fintech, founded in 2019, offering
  digital private banking for high-net-worth individuals and their businesses,
  including borderless multi-currency accounts, payments, and a curated selection
  of investment opportunities across fintech and real-estate-driven debt
  strategies. Fortu also operates a business-to-business Banking-as-a-Service (BaaS)
  platform that lets private banks, wealth managers, and multi-family offices roll
  out their own branded investment and payments products, with automated payment
  processing and an API-driven compliance-monitoring tool. Co-founded by co-CEOs
  Firdavs Shakhidi and Azmat Sultanov, the company was selected for the 500 Global
  startup accelerator and raised an oversubscribed crowdfunding round (~GBP 500k)
  on Seedrs. This profile was surfaced as a 500 Global portfolio company and
  enriched by the API Evangelist pipeline; Fortu does not currently publish a public
  developer portal, API documentation, or OpenAPI, and its primary web deployment
  was offline (HTTP 402, disabled deployment) at the time of enrichment.
